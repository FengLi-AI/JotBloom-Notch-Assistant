name: JotBloom

options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    CLANG_ENABLE_MODULES: true
    SWIFT_EMIT_LOC_STRINGS: false

targets:
  JotBloomCore:
    type: framework
    platform: macOS
    sources:
      - path: JotBloomCore
    dependencies:
      - sdk: libsqlite3.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jotbloom.mengsheng.core
        PRODUCT_NAME: JotBloomCore
        DEFINES_MODULE: true
        SKIP_INSTALL: true
        GENERATE_INFOPLIST_FILE: true

  JotBloom:
    type: application
    platform: macOS
    sources:
      - path: JotBloom
    dependencies:
      - target: JotBloomCore
        embed: true
    info:
      path: JotBloom/Info.plist
      properties:
        CFBundleDevelopmentRegion: zh_CN
        CFBundleDisplayName: 萌生｜JotBloom
        CFBundleIconFile: AppIcon.icns
        LSApplicationCategoryType: public.app-category.productivity
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: APPL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSMultipleInstancesProhibited: true
        LSUIElement: true
        NSHighResolutionCapable: true
        NSPrefersDisplaySafeAreaCompatibilityMode: false
        NSAppTransportSecurity:
          NSExceptionDomains:
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: false
            127.0.0.1:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: false
            "::1":
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: false
        NSPrincipalClass: NSApplication
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jotbloom.mengsheng
        PRODUCT_NAME: 萌生｜JotBloom
        PRODUCT_MODULE_NAME: JotBloom
        EXECUTABLE_NAME: JotBloom
        MARKETING_VERSION: 1.0.2
        CURRENT_PROJECT_VERSION: 1104
        CODE_SIGN_STYLE: Automatic
        ENABLE_APP_SANDBOX: false
        ENABLE_HARDENED_RUNTIME: false
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/../Frameworks"

  JotBloomTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: JotBloomTests
    dependencies:
      - target: JotBloomCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jotbloom.mengsheng.tests
        GENERATE_INFOPLIST_FILE: true
        MACOSX_DEPLOYMENT_TARGET: "14.0"

schemes:
  JotBloom:
    build:
      targets:
        JotBloom: all
        JotBloomCore: all
        JotBloomTests: [test]
    test:
      targets:
        - name: JotBloomTests
