name: Windows native UI check
on:
  workflow_dispatch:
  push:
    branches: [codex/native-dark-ui-20260914]
    paths: ['Windows/**', '.github/workflows/windows-ui-check.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: Windows/global.json
      - name: Core and storage contracts
        shell: pwsh
        run: |
          dotnet run --project Windows/tests/JotBloom.Windows.Core.Tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project Windows/tests/JotBloom.Windows.Storage.Tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python Windows/scripts/check-schema.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build self-contained Windows client
        shell: pwsh
        run: |
          dotnet publish Windows/src/JotBloom.Windows.Desktop -c Release -r win-x64 --self-contained true -p:DebugType=None -p:DebugSymbols=false -o "$env:RUNNER_TEMP/publish"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Render real WPF pages and exercise themes
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ui-evidence | Out-Null
          $process = Start-Process "$env:RUNNER_TEMP/publish/JotBloom.exe" -ArgumentList @('--ui-smoke', "$pwd/ui-evidence") -PassThru
          if (-not $process.WaitForExit(180000)) { $process.Kill(); throw 'UI check timed out' }
          Get-Content ui-evidence/report.json -ErrorAction SilentlyContinue
          Get-Content ui-evidence/exception.txt -ErrorAction SilentlyContinue
          if ($process.ExitCode -ne 0) { throw "UI check failed: $($process.ExitCode)" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-ui-evidence
          path: ui-evidence/
